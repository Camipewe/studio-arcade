# Runs after a pull request is merged into main (or when started by hand from
# the Actions tab). Rebuilds the GAMES list in index.html from every folder in
# games/ that passes the checker, and commits the change.
name: Update arcade game list

on:
  push:
    branches: [main]
    paths:
      - "games/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-arcade
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the game list
        run: |
          python3 check_games.py --write > report.txt 2>&1 || true
          cat report.txt
          rm -f index.backup.html
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if the list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Game list unchanged."
          else
            git commit -m "Update arcade game list"
            git push
          fi
